<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Ange, CEO and COO at USAD Labs</title>
  <desc id="d">Connect. Automate. Accelerate.</desc>
  <style>
    .bg { fill: #F4F6F8; }
    .ink { fill: #0E1A2B; }
    .muted { fill: #4A5668; }
    .accent { fill: #1F6FEB; }
    .line { stroke: #0E1A2B; }
    .node { fill: #F4F6F8; stroke: #0E1A2B; }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0E1A2B; }
      .ink { fill: #F4F6F8; }
      .muted { fill: #A9B4C4; }
      .accent { fill: #4C9AFF; }
      .line { stroke: #F4F6F8; }
      .node { fill: #0E1A2B; stroke: #F4F6F8; }
    }
  </style>
  <rect class="bg" width="1200" height="320" rx="16"/>

  <text class="ink" x="72" y="150" font-size="76" font-weight="700">Ange</text>
  <text class="muted" x="74" y="198" font-size="26">CEO &amp; COO at USAD Labs</text>
  <text class="ink" x="74" y="252" font-size="22" font-weight="600">Connect. Automate. <tspan class="accent">Accelerate.</tspan></text>

  <!-- three systems joined into one: the problem USAD Labs solves -->
  <g stroke-width="3" fill="none" class="line">
    <path d="M820 100 L960 160 L820 220"/>
    <path d="M960 160 L1110 160"/>
  </g>
  <g stroke-width="3">
    <circle class="node" cx="820" cy="100" r="18"/>
    <circle class="node" cx="820" cy="220" r="18"/>
    <circle class="node" cx="960" cy="160" r="18"/>
  </g>
  <circle class="accent" cx="1110" cy="160" r="26"/>
</svg>
